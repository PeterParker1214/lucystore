<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Lucy Store — Sari-sari Store Manager</title>
<meta name="description" content="Inventory, cash flow, utang and e-wallet manager for a sari-sari store.">
<meta name="application-name" content="Lucy Store">
<meta name="apple-mobile-web-app-title" content="Lucy Store">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#D63F2A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1410" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Theme: "Awning & Ink" — a custom sari-sari palette (cream paper, tomato awning, sun yellow, palm green, sea blue) */
:root{
  --bg:#FBF3E4; --panel:#FFFCF5; --field:#FFFFFF; --ink:#2A1A10; --soft:#7A6455;
  --edge:#2A1A10; --shadow:#2A1A10; --line:#E6D8C0;
  --tomato:#D63F2A; --on-tomato:#FFFFFF; --tomato-bg:#FBDDD5;
  --sun:#F6B93B; --on-sun:#2A1A10; --sun-bg:#FDEBBE;
  --palm:#2E7D4F; --on-palm:#FFFFFF; --palm-bg:#D9EEDD;
  --sea:#1F6F8B; --on-sea:#FFFFFF; --sea-bg:#D5E9F0;
  --overlay:rgba(30,16,8,.55);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1410; --panel:#271D17; --field:#1F1712; --ink:#F7EBDA; --soft:#B8A390;
    --edge:#5A473B; --shadow:#0B0806; --line:#3A2D24;
    --tomato:#F0654F; --on-tomato:#1B1410; --tomato-bg:#3D211B;
    --sun:#F6B93B; --on-sun:#2A1A10; --sun-bg:#3D2F12;
    --palm:#5CC08A; --on-palm:#1B1410; --palm-bg:#17301F;
    --sea:#5FB5D3; --on-sea:#1B1410; --sea-bg:#152B35;
    --overlay:rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#1B1410; --panel:#271D17; --field:#1F1712; --ink:#F7EBDA; --soft:#B8A390;
  --edge:#5A473B; --shadow:#0B0806; --line:#3A2D24;
  --tomato:#F0654F; --on-tomato:#1B1410; --tomato-bg:#3D211B;
  --sun:#F6B93B; --on-sun:#2A1A10; --sun-bg:#3D2F12;
  --palm:#5CC08A; --on-palm:#1B1410; --palm-bg:#17301F;
  --sea:#5FB5D3; --on-sea:#1B1410; --sea-bg:#152B35;
  --overlay:rgba(0,0,0,.65);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}
body.lock{overflow:hidden}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;margin:0;line-height:1.1}
button{font:inherit;color:inherit}
.disp{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;font-weight:800}
.num{font-variant-numeric:tabular-nums}
.soft{color:var(--soft)}
.red{color:var(--tomato)}.green{color:var(--palm)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}

/* Layout */
.wrap{max-width:46rem;margin:0 auto;padding:0 1rem}
main{padding-bottom:9.5rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding-top:.75rem}
.brand{min-width:0}
.brand b{display:block;font-family:'Bricolage Grotesque','Figtree',sans-serif;font-weight:800;font-size:1.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand span{font-size:.75rem;color:var(--soft)}
.awning{display:block;width:100%;height:26px;filter:drop-shadow(0 3px 0 var(--shadow))}
.pagehead{margin:1rem 0 .75rem}
.pagehead h1{font-size:1.9rem;font-weight:800}
.pagehead p{margin:.2rem 0 0;color:var(--soft);font-size:.9rem}

/* Nav */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);gap:.15rem;background:var(--panel);border-top:2px solid var(--edge);padding:.35rem .3rem calc(.35rem + env(safe-area-inset-bottom,0px))}
.navbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;min-height:50px;border:0;border-radius:12px;background:transparent;color:var(--soft);font-weight:700;font-size:.66rem;cursor:pointer}
.navbtn[aria-current="page"]{background:var(--sun);color:var(--on-sun)}
.navbtn svg{flex:none}
.sidebrand{display:none}
@media(min-width:768px){
  .navbar{top:0;right:auto;width:13.5rem;grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;gap:.3rem;border-top:0;border-right:2px solid var(--edge);padding:calc(1rem + env(safe-area-inset-top,0px)) .75rem 1rem}
  .navbtn{flex-direction:row;justify-content:flex-start;gap:.7rem;font-size:.95rem;padding:0 .8rem;min-height:46px}
  .sidebrand{display:flex;align-items:center;gap:.5rem;font-family:'Bricolage Grotesque','Figtree',sans-serif;font-weight:800;font-size:1.35rem;padding:.2rem .4rem 1rem}
  .shell{padding-left:13.5rem}
  main{padding-bottom:3rem}
}

/* Cards, buttons, tags */
.card{background:var(--panel);border:2px solid var(--edge);border-radius:16px;box-shadow:0 3px 0 var(--shadow);padding:.9rem 1rem}
.card.flat{box-shadow:none}
.cardhead{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin-bottom:.5rem}
.cardhead h2{font-size:1.1rem;font-weight:800}
.kicker{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.stack>*+*{margin-top:.75rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
@media(min-width:520px){.grid4{grid-template-columns:repeat(4,1fr)}}
.bigval{font-family:'Bricolage Grotesque','Figtree',sans-serif;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.hero{background:var(--sun);color:var(--on-sun)}
.hero .kicker{color:var(--on-sun);opacity:.8}
.bg-palm{background:var(--palm-bg)}.bg-tomato{background:var(--tomato-bg)}.bg-sea{background:var(--sea-bg)}.bg-sun{background:var(--sun-bg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;padding:.55rem 1rem;border:2px solid var(--edge);border-radius:12px;background:var(--panel);color:var(--ink);font-weight:700;font-size:.95rem;box-shadow:0 3px 0 var(--shadow);cursor:pointer;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.btn-red{background:var(--tomato);color:var(--on-tomato)}
.btn-green{background:var(--palm);color:var(--on-palm)}
.btn-blue{background:var(--sea);color:var(--on-sea)}
.btn-sun{background:var(--sun);color:var(--on-sun)}
.btn-ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn-ghost:active{transform:none}
.btn-sm{min-height:36px;padding:.3rem .7rem;font-size:.85rem;border-radius:10px;box-shadow:0 2px 0 var(--shadow)}
.btn-sm.btn-ghost{box-shadow:none}
.btn-block{width:100%}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
@media(min-width:520px){.actions.four{grid-template-columns:repeat(4,1fr)}}
.tag{display:inline-flex;align-items:center;gap:.25rem;font-size:.7rem;font-weight:800;padding:.12rem .5rem;border-radius:99px;border:1.5px solid var(--edge);background:var(--panel);white-space:nowrap}
.tag.g{background:var(--palm-bg);color:var(--ink)}.tag.r{background:var(--tomato-bg);color:var(--ink)}.tag.s{background:var(--sun-bg);color:var(--ink)}.tag.b{background:var(--sea-bg);color:var(--ink)}

/* Forms */
.field{margin-bottom:.75rem}
.field label,.lbl{display:block;font-size:.78rem;font-weight:800;margin-bottom:.25rem}
input,select,textarea{width:100%;min-height:44px;font:inherit;font-weight:600;color:var(--ink);background:var(--field);border:2px solid var(--edge);border-radius:10px;padding:.5rem .7rem}
input[type=checkbox]{width:auto;min-height:0;accent-color:var(--palm)}
.check{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.9rem;margin-bottom:.75rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.hint{font-size:.8rem;color:var(--soft);margin:-.4rem 0 .75rem}
.warn{font-size:.85rem;font-weight:700;background:var(--tomato-bg);border:1.5px solid var(--tomato);border-radius:10px;padding:.45rem .65rem;margin:.5rem 0}
.note{font-size:.85rem;background:var(--sea-bg);border-radius:10px;padding:.5rem .7rem;margin:.5rem 0}
.search{position:relative}
.search svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--soft)}
.search input{padding-left:2.3rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.chip{min-height:36px;padding:.25rem .8rem;border:2px solid var(--edge);border-radius:99px;background:var(--panel);font-weight:700;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Lists */
.list>.li{display:flex;align-items:center;gap:.7rem;padding:.65rem 0;border-bottom:1.5px dashed var(--line)}
.list>.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700;overflow-wrap:anywhere}
.li .s{font-size:.8rem;color:var(--soft)}
.li .amt{font-weight:800;text-align:right;white-space:nowrap}
.chips2{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.25rem}
.empty{text-align:center;padding:1.2rem .5rem;color:var(--soft)}
.empty b{display:block;color:var(--ink);font-family:'Bricolage Grotesque','Figtree',sans-serif;font-size:1.05rem;margin-bottom:.2rem}
.rowbtns{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.45rem}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.3rem 0}
.kv.total{border-top:2px solid var(--edge);margin-top:.3rem;padding-top:.5rem;font-weight:800}
.kv.sub{padding-left:.9rem;font-size:.9rem;color:var(--soft)}

/* Product grid */
.prods{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin-top:.6rem}
@media(min-width:520px){.prods{grid-template-columns:repeat(3,1fr)}}
.prod{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;text-align:left;min-height:84px;padding:.6rem .7rem;background:var(--panel);border:2px solid var(--edge);border-radius:14px;box-shadow:0 3px 0 var(--shadow);cursor:pointer}
.prod:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.prod b{font-size:.92rem;line-height:1.15;overflow-wrap:anywhere}
.prod .p{font-weight:800;color:var(--palm);font-variant-numeric:tabular-nums}
.prod small{color:var(--soft);font-weight:600;font-size:.75rem}
.prod.low small{color:var(--tomato);font-weight:800}
.prod .pic{width:100%;aspect-ratio:1.2/1;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:10px;background:var(--bg);border:1.5px solid var(--line);margin-bottom:.35rem}
.prod .pic img{width:100%;height:100%;object-fit:contain;display:block}
.prod .pic .ph{font-size:1.9rem;opacity:.45}
.itemthumb{width:58px;height:58px;flex:0 0 58px;border-radius:10px;overflow:hidden;background:var(--bg);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
.itemthumb img{width:100%;height:100%;object-fit:contain}
.itemthumb .ph{font-size:1.4rem;opacity:.4}
.photobox{display:flex;align-items:center;gap:.7rem;margin:.25rem 0 .8rem}
.photoprev{width:92px;height:92px;border:2px solid var(--edge);border-radius:12px;background:var(--bg);object-fit:contain}
.photoph{width:92px;height:92px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--soft);font-weight:800;text-align:center;font-size:.75rem}

/* Cart bar + toast */
#cartbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:19;padding:0 .75rem;pointer-events:none}
@media(min-width:768px){#cartbar{left:13.5rem;bottom:1rem}}
.cartbar{pointer-events:auto;max-width:46rem;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:.75rem;background:var(--ink);color:var(--bg);border:2px solid var(--edge);border-radius:16px;padding:.5rem .6rem .5rem 1rem;box-shadow:0 4px 0 var(--shadow)}
.cartbar b{display:block;font-size:.8rem;opacity:.8}
.cartbar .v{font-family:'Bricolage Grotesque','Figtree',sans-serif;font-weight:800;font-size:1.3rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:70;max-width:90%;background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:12px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}.btn:active,.prod:active{transform:none}.scanaim:after{animation:none}}
.scanbox{position:relative;width:100%;aspect-ratio:4/3;max-height:46vh;background:#12100f;border:2px solid var(--edge);border-radius:14px;overflow:hidden;box-shadow:0 3px 0 var(--shadow)}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanaim{position:absolute;inset:14% 8%;border:3px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.28);pointer-events:none}
.scanaim:after{content:'';position:absolute;left:0;right:0;top:50%;height:3px;background:var(--tomato);box-shadow:0 0 10px var(--tomato);animation:sweep 1.9s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(-42px)}50%{transform:translateY(42px)}}
.scanmsg{margin:.6rem 0 .9rem;font-weight:700;color:var(--soft);text-align:center;font-size:.92rem;line-height:1.35}
.scanmsg.ok{color:var(--palm)}.scanmsg.warn{color:var(--tomato)}
.scanhits{margin:0 0 .8rem;max-height:96px;overflow:auto}
.help h3{font-size:1rem;margin:1.1rem 0 .35rem}
.help h3:first-child{margin-top:0}
.help p,.help li{margin:.3rem 0;font-size:.95rem;line-height:1.45}
.help ol,.help ul{margin:.3rem 0;padding-left:1.25rem}
.help b{font-weight:800}
.lockwrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:1.25rem;background:var(--bg)}
.lockbox{width:100%;max-width:22rem;text-align:center}
.lockbox h1{font-size:1.6rem;margin:.9rem 0 .2rem}
.lockbox p{color:var(--soft);font-size:.9rem;margin:0 0 1.1rem}
.lockbox input{width:100%;text-align:center;letter-spacing:.4em;font-size:1.4rem;padding:.7rem;border:2px solid var(--edge);border-radius:12px;background:var(--field);color:var(--ink)}
.lockmsg{min-height:1.3rem;margin:.6rem 0;font-weight:700;font-size:.9rem;color:var(--tomato)}
.syncdot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--soft);margin-right:.4rem;vertical-align:middle}
.syncdot.on{background:var(--leaf)}
.syncdot.off{background:var(--tomato)}
.syncdot.busy{background:var(--sun);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.5rem;font-weight:900;letter-spacing:.22em;
  background:var(--field);border:2px dashed var(--edge);border-radius:12px;padding:.6rem;text-align:center;margin:.5rem 0}
.calcfab{position:fixed;z-index:45;width:52px;height:52px;border-radius:50%;border:2px solid var(--edge);
  background:var(--tomato);color:#fff;font-size:1.3rem;font-weight:900;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:grab;touch-action:none;user-select:none}
.calcfab.drag{cursor:grabbing;transform:scale(1.08)}
.calcpanel{position:fixed;z-index:46;width:15rem;background:var(--panel);border:2px solid var(--edge);border-radius:16px;
  padding:.6rem;box-shadow:0 12px 34px rgba(0,0,0,.45);touch-action:none}
.calcpanel[hidden]{display:none}
.calcbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem;cursor:grab}
.calcbar b{font-size:.8rem;color:var(--soft);letter-spacing:.04em;text-transform:uppercase}
.calcout{background:var(--field);border:2px solid var(--edge);border-radius:10px;padding:.45rem .6rem;text-align:right;
  font-variant-numeric:tabular-nums;font-size:1.35rem;font-weight:800;overflow:hidden;white-space:nowrap;min-height:1.9rem}
.calcexp{text-align:right;font-size:.75rem;color:var(--soft);min-height:1rem;overflow:hidden;white-space:nowrap}
.calcpad{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem;margin-top:.4rem}
.calcpad button{padding:.55rem 0;border-radius:10px;border:2px solid var(--edge);background:var(--field);color:var(--ink);
  font-size:1rem;font-weight:800;cursor:pointer}
.calcpad button.op{background:var(--panel2,var(--field));color:var(--sun)}
.calcpad button.eq{background:var(--tomato);color:#fff}
.calcpad button:active{transform:translateY(1px)}
.split{display:flex;flex-wrap:wrap;gap:.15rem 1rem;font-size:.85rem;opacity:.9;margin:.1rem 0 .2rem}
.hl{list-style:none;margin:.2rem 0 0;padding:0}
.hl li{position:relative;padding-left:1.4rem;margin:.35rem 0;font-size:.92rem;line-height:1.4}
.hl li:before{position:absolute;left:0;font-weight:900}
.hl li.v:before{content:'\2713';color:var(--leaf)}
.hl li.x:before{content:'!';color:var(--tomato)}
.li.voided .t,.li.voided .s{text-decoration:line-through;opacity:.55}
.scantorch{position:absolute;right:.5rem;bottom:.5rem;z-index:2;min-height:36px;padding:.3rem .7rem;border:2px solid var(--edge);border-radius:10px;background:var(--panel);color:var(--ink);font-weight:700;font-size:.85rem;cursor:pointer}
.scantorch[aria-pressed="true"]{background:var(--sun);color:var(--on-sun)}
.scanhits div{font-size:.82rem;color:var(--soft);font-weight:600;padding:.12rem 0}

/* Modal */
.overlay{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{width:100%;max-width:520px;max-height:94%;overflow:auto;background:var(--panel);border:2px solid var(--edge);border-radius:20px 20px 0 0;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px))}
@media(min-width:768px){.overlay{align-items:center}.sheet{border-radius:20px;max-height:90%}}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.shead h2{font-size:1.3rem;font-weight:800}
.mfoot{display:flex;gap:.6rem;justify-content:flex-end;margin-top:.5rem}
.mfoot .btn{flex:1}
.cl{display:flex;align-items:center;gap:.6rem;padding:.5rem 0;border-bottom:1.5px dashed var(--line)}
.cl .n{flex:1;min-width:0}.cl .n b{display:block;overflow-wrap:anywhere}.cl .n small{color:var(--soft)}
.qty{display:flex;align-items:center;gap:.3rem}
.qty input{width:3.6rem;text-align:center;min-height:36px;padding:.2rem}
.qty .btn{min-width:36px;padding:.2rem .5rem}
.ct{min-width:4.2rem;text-align:right;font-weight:800}
.paytabs{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin:.75rem 0}
.paytabs .btn{box-shadow:none;min-height:40px;padding:.3rem}
.sum{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:1.1rem;padding:.6rem 0}
.sum .v{font-family:'Bricolage Grotesque','Figtree',sans-serif;font-size:1.7rem}

/* Charts */
.chart{width:100%;height:auto;max-height:220px;display:block}
.chart text{fill:var(--soft);font-size:9px;font-weight:700;font-family:'Figtree',system-ui,sans-serif}
.chart .base{stroke:var(--edge);stroke-width:1.5}
.chart .ca{fill:var(--sea)}.chart .cb{fill:var(--palm)}.chart .cc{fill:var(--tomato)}
.legend{display:flex;gap:1rem;font-size:.78rem;font-weight:700;margin-top:.3rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.35rem;vertical-align:-1px}
</style>
</head>
<body>
<div id="app"></div>
<div id="cartbar"></div>
<div id="modal"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
/* KEY and the IndexedDB name below stay 'tindahan.*' even though the app is now called
   Lucy Store. They identify records already saved on the family's phones — renaming them
   would leave every device looking at an empty store. Cosmetic only; never "tidy" these. */
var KEY='tindahan.sarisari.v1', DAY=864e5;
/* A phone with a wrong clock files sales on the wrong day. Whenever we are online we
   take the server's Date header and keep the offset, so every timestamp is real time.
   ponytail: one probe per launch is enough — phone clocks drift by seconds, not hours. */
var clockOff=0;
function now(){return Date.now()+clockOff}
function syncClock(){
  if(!navigator.onLine)return;
  fetch(location.href,{method:'HEAD',cache:'no-store'}).then(function(r){
    var d=r.headers.get('date');if(!d)return;
    var t=Date.parse(d);if(!isFinite(t))return;
    var off=t-Date.now();
    if(Math.abs(off)>30000){clockOff=off;toast('Clock corrected by '+Math.round(off/60000)+' min')}
  }).catch(function(){});
}
window.addEventListener('online',syncClock);
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0}
function r2(n){return Math.round((+n||0)*100)/100}
function fmt(n){n=r2(n);var a=Math.abs(n);var s=a.toLocaleString('en-PH',{minimumFractionDigits:(a%1?2:0),maximumFractionDigits:2});return (n<0?'−':'')+'₱'+s}
function sgn(n){n=r2(n);return n===0?fmt(0):(n>0?'+':'−')+fmt(Math.abs(n))}
function startOfDay(ts){var d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()}
function fdate(ts){var d=new Date(ts),t0=startOfDay(now());var tm=d.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'});if(ts>=t0)return 'Today '+tm;if(ts>=t0-DAY)return 'Yesterday '+tm;return d.toLocaleDateString('en-PH',{month:'short',day:'numeric'})+' '+tm}
function plural(n,w){return n+' '+w+(n===1?'':'s')}

var ICON={
 scan:'<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8"/><path d="M10.5 8v8"/><path d="M14 8v8"/><path d="M17 8v8"/>',
 store:'<path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5"/><path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"/><path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05"/>',
 cart:'<path d="m15 11-1 9"/><path d="m19 11-4-7"/><path d="M2 11h20"/><path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4"/><path d="M4.5 15.5h15"/><path d="m5 11 4-7"/><path d="m9 11 1 9"/>',
 box:'<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/>',
 coins:'<path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17"/><path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/><path d="m2 16 6 6"/><circle cx="16" cy="9" r="2.9"/><circle cx="6" cy="5" r="3"/>',
 phone:'<rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>',
 cash:'<rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>',
 gear:'<path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/>',
 plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
 x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
 search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
 alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
 down:'<path d="M17 7 7 17"/><path d="M17 17H7V7"/>',
 up:'<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
 swap:'<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>',
 receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>'
};
function ic(n,s,w){s=s||20;return '<svg xmlns="http://www.w3.org/2000/svg" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+ICON[n]+'</svg>'}

/* ---------- state (saved in this browser) ---------- */
/* ponytail: two businesses is what exists. A third means turning this into a list in S. */
var BIZ=[['store','Sari-sari store'],['billiard','Billiard hall']];
function bizName(id){var b=BIZ.find(function(x){return x[0]===id});return b?b[1]:'Sari-sari store'}
var CATS=['Groceries','Drinks','Snacks','Personal care','Household','Other'];
var EXP_CATS=['Electricity','Water','Rent','Transport','Packaging & supplies','Repairs','Wages','Other'];
function fresh(){return {v:1,store:{name:'Lucy Store',feePer500:10,openingCash:0,opening:{store:0,billiard:0}},wallets:[{id:'gcash',name:'GCash',opening:0},{id:'maribank',name:'MariBank',opening:0}],items:[],suki:[],tx:[],setup:false,lastBackup:0}}
var memOnly=false;
/* Drops __proto__ while parsing, so a tampered backup cannot poison Object.prototype. */
function parseState(raw){
  var s=JSON.parse(raw,function(k,v){return k==='__proto__'?undefined:v});
  if(!s||!Array.isArray(s.tx)||!Array.isArray(s.items))return null;
  var f=fresh();
  var o=Object.assign(f,s,{store:Object.assign(f.store,s.store||{})});
  if(!Array.isArray(o.wallets)||!o.wallets.length)o.wallets=fresh().wallets;
  o.items.forEach(function(i){
    if(!Array.isArray(i.codes))i.codes=i.code?[String(i.code)]:[];
    i.codes=i.codes.map(function(x){return String(x||'').trim()}).filter(Boolean).filter(function(x,n,a){return a.indexOf(x)===n});
    if(!i.unit)i.unit='pc';
    if(!i.buyUnit)i.buyUnit=i.unit;
    if(!(num(i.packQty)>0))i.packQty=1;
    if(i.fractional==null)i.fractional=/^(kg|g|gram|grams|l|liter|litre|ml)$/i.test(i.unit);
  });   /* a backup with no wallets used to crash checkout */
  if(!o.store.opening){o.store.opening={store:+o.store.openingCash||0,billiard:0}}   /* one drawer became two */
  return o;
}
var crypt=null,locked=false;
/* localStorage caps out around 5 MB — a few years of entries. IndexedDB has no practical
   limit, so it is the real store; localStorage is kept as a mirror purely so an older
   copy of the app, or a browser that blocks IndexedDB, still finds the records.
   ponytail: one key, one value, whole-state writes. Per-row storage only matters if a
   single save ever gets slow, which at a sari-sari store's volume it will not. */
var store={raw:null,idb:null};
function idb(){
  if(store.idb)return store.idb;
  return store.idb=new Promise(function(res,rej){
    if(!window.indexedDB)return rej(0);
    var r=indexedDB.open('tindahan',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('kv')};
    r.onsuccess=function(){res(r.result)};
    r.onerror=function(){rej(r.error)};
  });
}
function idbDo(mode,fn){
  return idb().then(function(db){return new Promise(function(res,rej){
    var tx=db.transaction('kv',mode),rq=fn(tx.objectStore('kv'));
    rq.onsuccess=function(){res(rq.result)};
    rq.onerror=function(){rej(rq.error)};
  })});
}
function readStore(){
  return idbDo('readonly',function(o){return o.get('state')}).then(function(v){
    if(v)return v;
    var ls=null;try{ls=localStorage.getItem(KEY)}catch(e){}
    if(ls)return idbDo('readwrite',function(o){return o.put(ls,'state')}).then(function(){return ls},function(){return ls});
    return null;
  },function(){
    try{return localStorage.getItem(KEY)}catch(e){memOnly=true;return null}
  });
}
function writeStore(str){
  store.raw=str;
  try{localStorage.setItem(KEY,str)}catch(e){}        /* mirror only — a full quota here is fine */
  return idbDo('readwrite',function(o){return o.put(str,'state')}).then(function(){
    if(memOnly){memOnly=false;render()}
  },function(){
    if(!memOnly){memOnly=true;toast('Could not save — back up now.')}
  });
}
function load(){return fresh()}                        /* the real read happens in boot(), asynchronously */
var S=load();
var stamp=0;   /* bumped on every save; calc() caches against it */
function save(){
  stamp++;
  syLater();
  if(crypt){saveEnc();return}
  writeStore(JSON.stringify(S));
}
var ui={view:'home',sellQ:'',stockQ:'',stockF:'all',period:'today',ledgerN:30};
var cart={lines:[],pay:'cash',sid:'',wid:'',given:'',note:''};
var modal=null, C=null;

function item(id){return S.items.find(function(i){return i.id===id})}
function codesOf(i){
  var a=Array.isArray(i&&i.codes)?i.codes.slice():[];
  if(i&&i.code&&a.indexOf(String(i.code))<0)a.unshift(String(i.code));
  return a.map(function(x){return String(x||'').trim()}).filter(Boolean);
}
function codeText(i){return codesOf(i).join(' ')}
function itemPic(i,thumb){
  if(i&&i.photo)return '<div class="'+(thumb?'itemthumb':'pic')+'"><img src="'+esc(i.photo)+'" alt=""></div>';
  return '<div class="'+(thumb?'itemthumb':'pic')+'"><span class="ph">▧</span></div>';
}
function suki(id){return S.suki.find(function(s){return s.id===id})}
function wallet(id){return S.wallets.find(function(w){return w.id===id})}
function wname(id){var w=wallet(id);return w?w.name:'E-wallet'}
function sname(id){var s=suki(id);return s?s.name:'Unknown suki'}

/* ---------- derived balances ---------- */
var calcCache=null,calcStamp=-1;
function calc(){
  if(calcCache&&calcStamp===stamp)return calcCache;
  calcStamp=stamp;return calcCache=calcRaw();
}
function calcRaw(){
  var op=S.store.opening||{store:+S.store.openingCash||0,billiard:0};
  var drawer={};BIZ.forEach(function(b){drawer[b[0]]=+op[b[0]]||0});
  var wal={},debt={},stock={},chunks={};
  S.wallets.forEach(function(w){wal[w.id]=+w.opening||0});
  S.items.forEach(function(i){if(!i.svc)stock[i.id]=+i.start||0});   /* a service has nothing to count */
  S.suki.forEach(function(s){debt[s.id]=0;chunks[s.id]=[]});
  var txs=S.tx.filter(function(t){return !t.void}).sort(function(a,b){return a.ts-b.ts});
  txs.forEach(function(t){
    var cs=cashSplit(t);
    if(cs)Object.keys(cs).forEach(function(b){if(b in drawer)drawer[b]=r2(drawer[b]+cs[b]);else drawer.store=r2(drawer.store+cs[b])});
    if(t.wid&&(t.wid in wal))wal[t.wid]=r2(wal[t.wid]+(t.wal||0));
    if(t.sid&&(t.sid in debt)){
      var d=t.debt||0;debt[t.sid]=r2(debt[t.sid]+d);var ch=chunks[t.sid];
      if(d>0)ch.push({ts:t.ts,a:d});
      else if(d<0){d=-d;while(d>0.0001&&ch.length){var x=ch[0];if(x.a<=d+0.0001){d-=x.a;ch.shift()}else{x.a-=d;d=0}}}
    }
    (t.stk||[]).forEach(function(x){if(x.iid in stock)stock[x.iid]+=x.q});
  });
  var age={};
  Object.keys(chunks).forEach(function(id){age[id]=(chunks[id].length&&debt[id]>0.005)?Math.floor((now()-chunks[id][0].ts)/DAY):0});
  Object.keys(stock).forEach(function(k){stock[k]=r2(stock[k])});
  var tot=0;Object.keys(drawer).forEach(function(k){tot=r2(tot+drawer[k])});
  return {cash:tot,drawer:drawer,wal:wal,debt:debt,stock:stock,age:age};
}
/* Which drawer each entry moves, and by how much. Everything that counts cash goes
   through here, so there is one rule rather than one per entry type.
   A sale that mixes a softdrink with a game carries t.cb, split by what each line sold
   for. Everything older, and everything without a business, is the store's. */
function cashSplit(t){
  var c=t.cash||0;if(!c)return null;
  if(t.cb)return t.cb;
  var m={};m[t.biz||'store']=c;return m;
}
function cashCat(t){
  switch(t.type){
    case 'sale':return 'Cash sales';
    case 'payment':return 'Utang collected';
    case 'cash_loan':return 'Cash lent to suki';
    case 'expense':return t.cat||'Expenses';
    case 'restock':return 'Restocking';
    case 'owner':return t.cash>0?'Owner put in cash':'Owner took out cash';
    case 'ew':return {cashin:'E-wallet cash-in',cashout:'E-wallet cash-out',load:'Load & bills'}[t.kind]||'E-wallet';
    case 'move':return t.cash<0?'Cash moved to e-wallet':'Cash from e-wallet';
    default:return 'Count adjustments';
  }
}
function summ(from,to){
  var r={rev:0,cogs:0,fee:0,exp:0,n:0,cashIn:0,cashOut:0,inBy:{},outBy:{},biz:{}};
  BIZ.forEach(function(b){r.biz[b[0]]={rev:0,cogs:0,fee:0,exp:0,n:0}});
  S.tx.forEach(function(t){
    if(t.void||t.ts<from||t.ts>=to)return;
    if(t.type==='sale'){
      r.rev=r2(r.rev+(t.rev||0));r.cogs=r2(r.cogs+(t.cogs||0));r.n++;
      var seen={};
      (t.lines||[]).forEach(function(l){
        var bk=l.biz||'store',b=r.biz[bk]||r.biz.store;
        b.rev=r2(b.rev+l.qty*l.price);b.cogs=r2(b.cogs+l.qty*l.cost);
        if(!seen[bk]){seen[bk]=1;b.n++}
      });
    }
    r.fee=r2(r.fee+(t.fee||0));r.exp=r2(r.exp+(t.exp||0));
    var tb=r.biz[t.biz]||r.biz.store;
    tb.fee=r2(tb.fee+(t.fee||0));tb.exp=r2(tb.exp+(t.exp||0));
    var c=t.cash||0;
    if(c>0){r.cashIn=r2(r.cashIn+c);var k=cashCat(t);r.inBy[k]=r2((r.inBy[k]||0)+c)}
    else if(c<0){r.cashOut=r2(r.cashOut-c);var k2=cashCat(t);r.outBy[k2]=r2((r.outBy[k2]||0)-c)}
  });
  r.gross=r2(r.rev-r.cogs);r.earn=r2(r.gross+r.fee);r.net=r2(r.earn-r.exp);
  BIZ.forEach(function(x){var b=r.biz[x[0]];b.gross=r2(b.rev-b.cogs);b.net=r2(b.gross+b.fee-b.exp)});
  return r;
}
function periodRange(p){
  var t0=startOfDay(now()),d=new Date();
  if(p==='today')return {from:t0,to:t0+DAY,label:'Today'};
  if(p==='7d')return {from:t0-6*DAY,to:t0+DAY,label:'Last 7 days'};
  if(p==='30d')return {from:t0-29*DAY,to:t0+DAY,label:'Last 30 days'};
  var a=new Date(d.getFullYear(),d.getMonth(),1).getTime(),b=new Date(d.getFullYear(),d.getMonth()+1,1).getTime();
  return {from:a,to:b,label:d.toLocaleDateString('en-PH',{month:'long',year:'numeric'})};
}

/* ---------- small UI pieces ---------- */
function toast(m){var e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},2300)}
function field(label,name,val,o){o=o||{};
  var attrs=o.num?'type="number" inputmode="decimal" step="any"'+(o.neg?'':' min="0"')
          :o.type?'type="'+o.type+'"'+(o.type==='email'?' inputmode="email" autocapitalize="off" spellcheck="false"':'')
          :'type="text"';
  return '<div class="field"><label for="f_'+name+'">'+esc(label)+'</label><input id="f_'+name+'" name="'+name+'" value="'+esc(val==null?'':val)+'" '+attrs+(o.list?' list="'+o.list+'"':'')+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+' autocomplete="'+(o.ac||'off')+'"></div>'}
function sel(label,name,opts,val){
  return '<div class="field"><label for="f_'+name+'">'+esc(label)+'</label><select id="f_'+name+'" name="'+name+'">'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select></div>'}
function walletOpts(){return S.wallets.map(function(w){return [w.id,w.name]})}
function empty(t,s,btn){return '<div class="empty"><b>'+esc(t)+'</b>'+esc(s||'')+(btn?'<div style="margin-top:.7rem">'+btn+'</div>':'')+'</div>'}
function tag(txt,cls){return '<span class="tag '+(cls||'')+'">'+esc(txt)+'</span>'}

function chart(days,keys,label){
  var W=320,H=140,pb=18,pt=6,n=days.length,gap=W/n,bw=Math.max(2,Math.min(12,gap*0.38));
  var max=1;days.forEach(function(d){keys.forEach(function(k){max=Math.max(max,d[k.k])})});
  var g='<line class="base" x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>';
  var step=n>14?Math.ceil(n/7):1;
  days.forEach(function(d,i){
    var x=i*gap+gap/2;
    keys.forEach(function(k,j){
      var h=(d[k.k]/max)*(H-pb-pt),xx=x+(j-(keys.length-1)/2)*(bw+1)-bw/2;
      g+='<rect class="'+k.c+'" x="'+xx.toFixed(1)+'" y="'+(H-pb-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(d[k.k]>0?Math.max(h,2):0).toFixed(1)+'" rx="2"><title>'+esc(d.label+' — '+k.l+': '+fmt(d[k.k]))+'</title></rect>';
    });
    if(i%step===0)g+='<text x="'+x.toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle">'+esc(d.label)+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">'+g+'</svg>'+
    '<div class="legend">'+keys.map(function(k){return '<span><i class="'+k.c+'" style="background:var(--'+(k.c==='ca'?'sea':k.c==='cb'?'palm':'tomato')+')"></i>'+esc(k.l)+'</span>'}).join('')+'</div>';
}
function dayBuckets(from,to){
  var out=[];for(var t=from;t<to;t+=DAY){var s=summ(t,t+DAY);out.push({label:new Date(t).toLocaleDateString('en-PH',{weekday:(to-from)<=7*DAY?'short':undefined,month:(to-from)<=7*DAY?undefined:'numeric',day:(to-from)<=7*DAY?undefined:'numeric'}),sales:s.rev,earn:s.earn,cin:s.cashIn,cout:s.cashOut})}
  return out;
}

/* ---------- transactions display ---------- */
function txTitle(t){
  switch(t.type){
    case 'sale':var L=t.lines||[];if(!L.length)return 'Sale';var f=L[0];return (L.length>1?f.name+' +'+(L.length-1)+' more':(f.qty!==1?f.qty+'× ':'')+f.name);
    case 'payment':return (t.via==='writeoff'?'Written off — ':'Utang payment — ')+sname(t.sid);
    case 'cash_loan':return 'Cash lent to '+sname(t.sid);
    case 'debt_open':return 'Existing utang — '+sname(t.sid);
    case 'expense':return 'Expense: '+(t.cat||'Other');
    case 'restock':return 'Restocked '+((t.lines&&t.lines[0])?t.lines[0].name:'item');
    case 'stock_adj':return 'Stock adjustment — '+((t.lines&&t.lines[0])?t.lines[0].name:'item');
    case 'owner':return t.cash>0?'Owner put in cash':'Owner took out cash';
    case 'ew':return ({cashin:'Cash-in',cashout:'Cash-out',load:'Load & bills'})[t.kind]+' · '+wname(t.wid);
    case 'move':return t.cash<0?'Cash → '+wname(t.wid):wname(t.wid)+' → cash';
    case 'adjust_cash':return 'Cash count adjustment';
    case 'adjust_wallet':return wname(t.wid)+' balance adjustment';
    default:return 'Entry';
  }
}
function txSub(t){
  var p=[fdate(t.ts)];
  if(t.type==='sale')p.push(t.sid?'On utang — '+sname(t.sid):t.wid?'Paid by '+wname(t.wid):'Cash');
  if(t.type==='restock'&&t.lines&&t.lines[0]){var z=t.lines[0];p.push(z.qty+' '+(z.buyUnit||'unit')+' × '+fmt(z.cost)+(z.stockQty!=null?' → '+z.stockQty+' '+(z.unit||'units'):'') )}
  if(t.type==='ew'&&t.amount)p.push('Amount '+fmt(t.amount));
  if(t.note)p.push(t.note);
  return p.join(' · ');
}
function txChips(t){
  var c='';
  if(t.cash)c+=tag('Cash '+sgn(t.cash),t.cash>0?'g':'r');
  if(t.wal)c+=tag(wname(t.wid)+' '+sgn(t.wal),'b');
  if(t.debt)c+=tag('Utang '+sgn(t.debt),t.debt>0?'s':'g');
  if(t.fee>0)c+=tag('Fee '+fmt(t.fee),'g');
  if(t.type==='sale')c+=tag('Profit '+fmt(t.rev-t.cogs),'');
  return c?'<div class="chips2">'+c+'</div>':'';
}
function txRow(t,noVoid){
  return '<div class="li'+(t.void?' voided':'')+'"><div class="grow"><div class="t">'+esc(txTitle(t))+(t.void?' '+tag('Voided','r'):'')+'</div><div class="s">'+esc(txSub(t))+'</div>'+(t.void?'':txChips(t))+'</div>'+
    (noVoid||t.void?'':'<button class="btn btn-ghost btn-sm" data-act="void" data-id="'+t.id+'" aria-label="Void this entry">Void</button>')+'</div>';
}

/* Home */
function viewHome(c){
  var nw=now(),t0=startOfDay(nw),td=summ(t0,t0+DAY);

  var g=new Date().getHours(),hello=g<12?'Good morning!':g<18?'Good afternoon!':'Good evening!';
  var days=dayBuckets(t0-6*DAY,t0+DAY),wk=days.reduce(function(a,d){return a+d.sales},0);
  var low=S.items.filter(function(i){return !i.svc&&i.reorder>0&&c.stock[i.id]<=i.reorder}).sort(function(a,b){return (c.stock[a.id]/a.reorder)-(c.stock[b.id]/b.reorder)});

  if(S.tx.length&&now()-(S.lastBackup||0)>2*DAY)h+='<div class="card bg-tomato"><div class="cardhead"><h2>Back up your records</h2></div><p style="margin:0 0 .7rem">'+(S.lastBackup?'Last backup was '+plural(Math.floor((now()-S.lastBackup)/DAY),'day')+' ago.':'You have never backed up.')+' Everything here lives only on this device — if it is lost or wiped, so are your records.</p><button class="btn btn-red" data-act="export">Back up now</button></div>';
  h+=healthCard(c);
  if(!S.setup)h+='<div class="card bg-sea"><div class="cardhead"><h2>Set up your store</h2></div><p style="margin:0 0 .7rem">Enter your starting drawer cash and e-wallet balances so every total is correct from day one, then add your items in Stock.</p><div class="rowbtns"><button class="btn btn-blue" data-act="settings">Enter starting balances</button><button class="btn" data-act="help">How to use it</button><button class="btn btn-ghost" data-act="dismisssetup">Later</button></div></div>';
  h+='<div class="card hero"><div class="kicker">Cash in drawer</div><div class="bigval" style="font-size:2.8rem;margin-top:.3rem">'+fmt(c.cash)+'</div>'+drawerSplit(c)+'<div style="font-size:.85rem;margin-top:.4rem;opacity:.85">What the cash boxes should hold right now, based on your records.</div></div>';
  h+='<div class="grid2"><div class="card"><div class="kicker">Sales today</div><div class="bigval" style="font-size:1.7rem;margin-top:.2rem">'+fmt(td.rev)+'</div><div class="soft" style="font-size:.8rem">'+plural(td.n,'sale')+'</div></div>'+
     '<div class="card bg-palm"><div class="kicker">Profit today</div><div class="bigval" style="font-size:1.7rem;margin-top:.2rem">'+fmt(td.earn)+'</div><div class="soft" style="font-size:.8rem">Sales profit + wallet fees</div></div>'+
     '<div class="card bg-tomato"><div class="kicker">Owed by suki</div><div class="bigval" style="font-size:1.7rem;margin-top:.2rem">'+fmt(owed)+'</div><div class="soft" style="font-size:.8rem">'+debtors.length+' suki'+(overdue.length?' · '+overdue.length+' overdue':'')+'</div></div>'+
     '<div class="card bg-sea"><div class="kicker">E-wallets</div><div class="bigval" style="font-size:1.7rem;margin-top:.2rem">'+fmt(wtot)+'</div><div class="soft" style="font-size:.8rem">'+S.wallets.map(function(w){return esc(w.name)+' '+fmt(c.wal[w.id])}).join(' · ')+'</div></div></div>';
  h+='<div class="actions four"><button class="btn btn-red" data-act="go" data-id="sell">'+ic('cart',18)+'New sale</button><button class="btn btn-blue" data-act="go" data-id="wallet">'+ic('phone',18)+'E-wallet</button><button class="btn btn-green" data-act="go" data-id="utang">'+ic('coins',18)+'Collect</button><button class="btn" data-act="expense">'+ic('receipt',18)+'Expense</button></div>';
  h+='<div class="card"><div class="cardhead"><h2>Sales — last 7 days</h2><span class="num soft">'+fmt(wk)+'</span></div>'+chart(days,[{k:'sales',c:'ca',l:'Sales'},{k:'earn',c:'cb',l:'Profit'}],'Sales and profit for the last 7 days')+'</div>';
  h+='<div class="card"><div class="cardhead"><h2>Needs restocking</h2><button class="btn btn-ghost btn-sm" data-act="go" data-id="stock">See all</button></div>';
  h+=low.length?'<div class="list">'+low.slice(0,4).map(function(i){return '<div class="li"><div class="grow"><div class="t">'+esc(i.name)+'</div><div class="s">Reorder at '+i.reorder+' · '+(c.stock[i.id]<=0?'<b class="red">Out of stock</b>':c.stock[i.id]+' '+esc(i.unit||'left')+' left')+'</div></div><button class="btn btn-sm" data-act="restock" data-id="'+i.id+'">Restock</button></div>'}).join('')+'</div>':empty(S.items.length?'All stocked up':'No items yet',S.items.length?'Nothing is below its reorder level.':'Add your products in Stock to track inventory.');
  h+='</div><div class="card"><div class="cardhead"><h2>Biggest utang</h2><button class="btn btn-ghost btn-sm" data-act="go" data-id="utang">See all</button></div>';
  h+=debtors.length?'<div class="list">'+debtors.slice(0,3).map(function(s){return '<div class="li" data-act="suki" data-id="'+s.id+'" style="cursor:pointer"><div class="grow"><div class="t">'+esc(s.name)+'</div><div class="s">'+ageText(c.age[s.id])+'</div></div><div class="amt num">'+fmt(c.debt[s.id])+'</div></div>'}).join('')+'</div>':empty('No utang','Nobody owes you anything right now.');
  h+='</div><div class="card"><div class="cardhead"><h2>Recent activity</h2><button class="btn btn-ghost btn-sm" data-act="go" data-id="money">Ledger</button></div>';
  h+=recent.length?'<div class="list">'+recent.map(function(t){return txRow(t,true)}).join('')+'</div>':empty('Nothing yet','Your sales and money movements will show up here.');
  return h+'</div></div>';

  }).join('')+'</div>';

/* Stock */
function stockRows(c){
  var q=ui.stockQ.trim().toLowerCase();
  var list=S.items.filter(function(i){
    var st=c.stock[i.id];
    if(q&&i.name.toLowerCase().indexOf(q)<0&&(i.cat||'').toLowerCase().indexOf(q)<0&&codeText(i).indexOf(q)<0)return false;
    if(ui.stockF==='low')return !i.svc&&i.reorder>0&&st<=i.reorder&&st>0;
    if(ui.stockF==='out')return !i.svc&&st<=0;
    return true;
  }).sort(function(a,b){return a.name.localeCompare(b.name)});
  if(!S.items.length)return empty('No items yet','Add what you sell, with its cost and selling price.','<button class="btn btn-green" data-act="additem">'+ic('plus',18)+'Add item</button> <button class="btn" data-act="sample">Load sample items</button>');
  if(!list.length)return empty('Nothing here','No items match this filter.');
  return '<div class="list">'+list.map(function(i){
    var st=c.stock[i.id],margin=i.price-i.cost,mp=i.price>0?Math.round(margin/i.price*100):0;
    var stag=i.svc?tag('Service','b'):st<=0?tag('Out of stock','r'):(i.reorder>0&&st<=i.reorder)?tag('Low','s'):tag('OK','g');
    return '<div class="li" style="align-items:flex-start">'+itemPic(i,true)+'<div class="grow"><div class="t">'+esc(i.name)+' '+stag+'</div><div class="s">'+esc(i.cat||'')+' · Cost '+fmt(i.cost)+'/'+esc(i.unit||'pc')+' · Price '+fmt(i.price)+' · Margin '+fmt(margin)+' ('+mp+'%)</div>'+
      '<div class="rowbtns">'+(i.svc?'':'<button class="btn btn-sm btn-green" data-act="restock" data-id="'+i.id+'">Restock</button><button class="btn btn-sm" data-act="adjstock" data-id="'+i.id+'">Adjust</button>')+'<button class="btn btn-sm" data-act="edititem" data-id="'+i.id+'">Edit</button></div></div>'+
      '<div class="amt num" style="font-size:1.25rem">'+(i.svc?'—':(+st.toFixed(2))+'<div class="s" style="font-weight:600">'+esc(i.unit||'pcs')+'</div>')+'</div></div>'}).join('')+'</div>';
}
function viewStock(c){
  var cost=0,retail=0,lowN=0;
  S.items.forEach(function(i){if(i.svc)return;var st=Math.max(0,c.stock[i.id]);cost+=st*i.cost;retail+=st*i.price;if(i.reorder>0&&c.stock[i.id]<=i.reorder)lowN++});
  return '<div class="pagehead" style="display:flex;justify-content:space-between;align-items:flex-end;gap:.6rem"><div><h1>Inventory</h1><p>'+plural(S.items.length,'item')+' tracked</p></div><button class="btn" data-act="scanstock">'+ic('scan',18)+'Scan</button> <button class="btn btn-green" data-act="additem">'+ic('plus',18)+'Add item</button></div>'+
   '<div class="grid4"><div class="card flat"><div class="kicker">Stock value (cost)</div><div class="bigval num" style="font-size:1.25rem;margin-top:.2rem">'+fmt(cost)+'</div></div><div class="card flat"><div class="kicker">If all sold</div><div class="bigval num" style="font-size:1.25rem;margin-top:.2rem">'+fmt(retail)+'</div></div><div class="card flat"><div class="kicker">Potential profit</div><div class="bigval num green" style="font-size:1.25rem;margin-top:.2rem">'+fmt(retail-cost)+'</div></div><div class="card flat bg-sun"><div class="kicker">Need restock</div><div class="bigval" style="font-size:1.25rem;margin-top:.2rem">'+lowN+'</div></div></div>'+
   '<div class="search" style="margin-top:.8rem"><span class="sr"><label for="stockSearch">Search inventory</label></span>'+ic('search',18)+'<input id="stockSearch" data-input="stockQ" type="search" placeholder="Search name or barcode" value="'+esc(ui.stockQ)+'" autocomplete="off"></div>'+
   '<div class="chips" role="group" aria-label="Filter">'+[['all','All'],['low','Low stock'],['out','Out of stock']].map(function(f){return '<button class="chip" data-act="stockf" data-id="'+f[0]+'" aria-pressed="'+(ui.stockF===f[0])+'">'+f[1]+'</button>'}).join('')+'</div>'+
   '<div class="card" id="results">'+stockRows(c)+'</div>';
}

/* Utang */

/* A plain-language read on the business: this week against last week, plus the things
   that actually sink a sari-sari store — utang you cannot collect, and empty shelves.
   ponytail: thresholds are guesses tuned for a small shop. They all live in this one function. */
function health(c){
  var t0=startOfDay(now()),wk=summ(t0-6*DAY,t0+DAY),prev=summ(t0-13*DAY,t0-6*DAY);
  var owed=S.suki.reduce(function(a,s){return a+Math.max(0,c.debt[s.id]||0)},0);
  var overdue=S.suki.filter(function(s){return c.age[s.id]>=14&&c.debt[s.id]>0.005})
                    .reduce(function(a,s){return a+c.debt[s.id]},0);
  var out=S.items.filter(function(i){return !i.svc&&c.stock[i.id]<=0}).length;
  var sellable=S.items.filter(function(i){return !i.svc}).length;
  var good=[],bad=[];
  if(wk.net>0)good.push('You made '+fmt(wk.net)+' profit in the last 7 days.');
  else if(wk.n)bad.push('The last 7 days lost '+fmt(-wk.net)+'.');
  if(prev.n){
    var ch=wk.rev-prev.rev,pc=prev.rev>0?Math.round(ch/prev.rev*100):0;
    if(pc>=10)good.push('Sales are up '+pc+'% from the week before.');
    else if(pc<=-10)bad.push('Sales are down '+Math.abs(pc)+'% from the week before.');
  }
  if(wk.rev>0){
    var m=Math.round(wk.gross/wk.rev*100);
    if(m<12)bad.push('You keep only '+m+' centavos of every peso sold — prices may be too near cost.');
    else if(m>=20)good.push('You keep '+m+' centavos of every peso sold.');
  }
  if(owed>0&&wk.rev>0&&owed>wk.rev)bad.push('Utang out ('+fmt(owed)+') is more than a whole week of sales.');
  if(overdue>0)bad.push(fmt(overdue)+' of utang is over 14 days old.');
  if(sellable&&out/sellable>=0.2)bad.push(out+' of '+sellable+' items are out of stock — customers are leaving empty-handed.');
  else if(out)bad.push(plural(out,'item')+' out of stock.');
  BIZ.forEach(function(b){if(c.drawer[b[0]]<0)bad.push(b[1]+' cash is recorded as negative — something was entered wrong.')});
  var st=!bad.length?['g','Doing well']
        :(wk.net<0&&wk.n)?['r','Needs attention']
        :bad.length>=3?['r','Needs attention']:['s','Keep an eye on it'];
  return {cls:st[0],label:st[1],good:good,bad:bad,wk:wk};
}
/* Only worth showing once the second business has money of its own. */
function drawerSplit(c){
  if(!BIZ.filter(function(b){return c.drawer[b[0]]}).length)return '';
  return '<div class="split">'+BIZ.map(function(b){
    return '<span>'+esc(b[1])+' <b>'+fmt(c.drawer[b[0]])+'</b></span>';
  }).join('')+'</div>';
}
function healthCard(c){
  if(!S.tx.length)return '';
  var h=health(c);
  var bg=h.cls==='g'?'bg-leaf':h.cls==='r'?'bg-tomato':'bg-sun';
  var lines=h.bad.map(function(t){return '<li class="x">'+esc(t)+'</li>'})
           .concat(h.good.map(function(t){return '<li class="v">'+esc(t)+'</li>'})).slice(0,4);
  return '<div class="card '+bg+'"><div class="cardhead"><h2>How the business is doing</h2>'+tag(h.label,h.cls)+'</div>'+
    '<ul class="hl">'+lines.join('')+'</ul>'+
    '<div class="hint" style="margin:.4rem 0 0">Last 7 days, compared with the 7 before.</div></div>';
}

      made++;msg.push(b[1]+' '+sgn(diff));
    });
    if(!made&&!msg.length){toast('Enter at least one count');return false}
    if(made)save();
    toast(msg.join(', '));
  },
  {label:'Save count',hook:function(){

/* e-wallet */
function suggestFee(a){var per=+S.store.feePer500||0;return per>0&&a>0?Math.ceil(a/500)*per:0}
function ewEffects(kind,a,fee,mode){
  var cash=0,wal=0;
  if(kind==='cashin'||kind==='load'){if(mode==='top'){cash=a+fee;wal=-a}else{cash=a;wal=-(a-fee)}}
  else{if(mode==='top'){wal=a+fee;cash=-a}else{wal=a;cash=-(a-fee)}}
  return {cash:r2(cash),wal:r2(wal)};
}
function ewForm(kind){
  var name={cashin:'Cash-in',cashout:'Cash-out',load:'Load & bills'}[kind],touched=false;
  var desc={cashin:'Customer gives you cash, you send e-money to their account.',cashout:'Customer sends e-money to your wallet, you give them cash.',load:'You pay load or a bill from your wallet, the customer pays you cash.'}[kind];
  form(name,function(){return '<p class="hint" style="margin-top:0">'+desc+'</p>'+sel('Wallet','wid',walletOpts(),S.wallets[0]&&S.wallets[0].id)+field('Amount (₱)','amt','',{num:1})+
    field('Your fee (₱)','fee','',{num:1})+'<div id="feehint" class="hint">Suggested fee: ₱0 (₱'+(S.store.feePer500||0)+' per ₱500 — change in Settings)</div>'+
    sel('How is the fee handled?','mode',[['top','Added on top of the amount'],['deduct','Taken out of the amount']],kind==='cashout'?'deduct':'top')+
    field('Customer / reference (optional)','note','')+'<div id="ewprev" class="note">Enter an amount to see how your cash and wallet change.</div>'},
  function(d){
    var a=num(d.amt),fee=num(d.fee);if(a<=0){toast('Enter an amount');return false}
    if(d.mode==='deduct'&&fee>a){toast('The fee is bigger than the amount');return false}
    var e=ewEffects(kind,a,fee,d.mode);
    S.tx.push({id:uid(),ts:now(),type:'ew',kind:kind,wid:d.wid,amount:a,fee:fee,mode:d.mode,cash:e.cash,wal:e.wal,note:(d.note||'').trim()});
    save();toast(name+' recorded');
  },{label:'Record '+name.toLowerCase(),hook:function(el){
    var d=fd(),a=num(d.amt);
    if(el&&el.name==='fee')touched=true;
    if(el&&el.name==='amt'&&!touched){var f=$('#f_fee');if(f)f.value=a>0?suggestFee(a):'';d=fd()}
    var fee=num(d.fee),e=ewEffects(kind,a,fee,d.mode),w=wname(d.wid),msg='';
    var sf=$('#feehint');if(sf)sf.textContent='Suggested fee: '+fmt(suggestFee(a))+' (₱'+(S.store.feePer500||0)+' per ₱500 — change in Settings)';
    if(a>0){
      msg='Drawer cash: <b>'+sgn(e.cash)+'</b> · '+esc(w)+': <b>'+sgn(e.wal)+'</b> · Your fee: <b>'+fmt(fee)+'</b>';
      var cw=calc();
      if(cw.wal[d.wid]+e.wal<0)msg+='<div class="warn">'+esc(w)+' would go below zero — top it up first or check the amount.</div>';
      if(cw.cash+e.cash<0)msg+='<div class="warn">Your drawer doesn\'t have enough cash for this ('+fmt(cw.cash)+' recorded).</div>';
    }
    var p=$('#ewprev');if(p)p.innerHTML=msg||'Enter an amount to see how your cash and wallet change.';
  }});
}

function addCart(id,qty){

function cartBody(){

  var tot=cartTotal(),h='<div>'+(lines||empty('Cart is empty','Tap items to add them.'))+'</div><div class="sum"><span>Total</span><span class="v num" id="ctotal">'+fmt(tot)+'</span></div>';
  h+='<div class="lbl">Customer pays with</div><div class="paytabs" role="group" aria-label="Payment method">'+[['cash','Cash'],['utang','Utang'],['wallet','E-wallet']].map(function(p){return '<button type="button" class="btn" data-act="cpay" data-id="'+p[0]+'" aria-pressed="'+(cart.pay===p[0])+'">'+p[1]+'</button>'}).join('')+'</div>';
  if(cart.pay==='cash')h+=field('Cash received (optional)','given',cart.given,{num:1})+'<div id="change" class="hint"></div>';
  if(cart.pay==='utang'){
    h+=(S.suki.length?sel('Whose utang?','sid',[['','Choose a suki…']].concat(S.suki.map(function(s){return [s.id,s.name]})),cart.sid):'<div class="note">No suki yet.</div>')+'<button type="button" class="btn btn-sm" data-act="cnewsuki" style="margin-bottom:.75rem">'+ic('plus',16)+'New suki</button><div id="cartwarn"></div>';
  }

function patchCart(){
  var tot=cartTotal();
  cart.lines.forEach(function(l,i){var e=$('#lt'+i);if(e)e.textContent=fmt(l.price*l.qty)});
  var e=$('#ctotal');if(e)e.textContent=fmt(tot);
  var b=$('#msub');if(b)b.textContent='Charge '+fmt(tot);
  var ch=$('#change');if(ch){var g=num(cart.given);ch.innerHTML=g?(g>=tot?'Change: <b>'+fmt(g-tot)+'</b>':'<b class="red">Short by '+fmt(tot-g)+'</b>'):''}
  var w=$('#cartwarn');if(w){var s=cart.sid&&suki(cart.sid);w.innerHTML='';if(s){var bal=(C||calc()).debt[s.id]||0;if(s.limit>0&&bal+tot>s.limit)w.innerHTML='<div class="warn">This puts '+esc(s.name)+' over the credit limit ('+fmt(bal+tot)+' of '+fmt(s.limit)+').</div>';else if(bal>0)w.innerHTML='<div class="note">'+esc(s.name)+' currently owes '+fmt(bal)+'.</div>'}}
}
function openCart(){
  if(!cart.wid&&S.wallets[0])cart.wid=S.wallets[0].id;
  openModal({title:'Checkout',body:cartBody,label:function(){return 'Charge '+fmt(cartTotal())},cls:'btn-red',focus:false,submit:checkout});
  patchCart();
}
function checkout(){
  cart.lines=cart.lines.filter(function(l){return l.qty>0});
  var tot=cartTotal();if(!cart.lines.length||tot<=0){toast('Add something to the cart first');return false}
  if(cart.pay==='utang'&&!cart.sid){toast('Choose whose utang this is');return false}
  var t={id:uid(),ts:now(),type:'sale',lines:cart.lines.map(function(l){var it=l.iid&&item(l.iid);return {iid:l.iid,name:l.name,qty:l.qty,price:l.price,cost:l.cost,biz:(it&&it.biz)||'store'}}),rev:tot,cogs:r2(cart.lines.reduce(function(a,l){return a+l.qty*l.cost},0)),note:(cart.note||'').trim(),
    stk:cart.lines.filter(function(l){var it=l.iid&&item(l.iid);return it&&!it.svc}).map(function(l){return {iid:l.iid,q:-l.qty}})};
  if(cart.pay==='cash'){
    t.cash=tot;
    var by={};
    cart.lines.forEach(function(l){
      var it=l.iid&&item(l.iid),b=(it&&it.biz)||'store';
      by[b]=r2((by[b]||0)+l.qty*l.price);
    });
    var ks=Object.keys(by);
    if(ks.length>1){
      var sum=0;ks.forEach(function(k){sum=r2(sum+by[k])});
      if(sum!==tot){                                  /* give any stray centavo to the biggest share */
        var big=ks.reduce(function(a,k){return by[k]>by[a]?k:a},ks[0]);
        by[big]=r2(by[big]+(tot-sum));
      }
      t.cb=by;
    } else t.biz=ks[0]||'store';
  }
  else if(cart.pay==='utang'){t.sid=cart.sid;t.debt=tot}
  else{
    var w=cart.wid||(S.wallets[0]&&S.wallets[0].id);
    if(!w){toast('Add an e-wallet in Settings first');return false}
    t.wid=w;t.wal=tot;
  }
  S.tx.push(t);save();
  var msg='Sale recorded — '+fmt(tot);if(cart.pay==='cash'&&num(cart.given)>tot)msg+=' · change '+fmt(num(cart.given)-tot);
  cart={lines:[],pay:'cash',sid:'',wid:'',given:'',note:''};toast(msg);
}

/* ---- how to use ---- */
function helpBody(){return '<div class="help">'+
 '<h3>What this app does</h3>'+
 '<p>It keeps the shop\'s records: what you sold, what is left on the shelf, how much cash should be in the drawer, who owes you utang, and your GCash and MariBank money. Nothing is sent anywhere — it all stays on this phone or laptop.</p>'+

 '<h3>Selling something (the counter)</h3>'+
 '<ol><li>Open <b>Sell</b>.</li>'+
 '<li>Tap <b>Scan</b> and point the camera at the barcode. It beeps and drops the item in the cart. Keep scanning — one beep per item.</li>'+
 '<li>No barcode on it? Tap the item in the list instead, or use <b>Custom</b> for anything not in your stock.</li>'+
 '<li>Tap <b>Checkout</b>.</li>'+
 '<li>Type what the customer handed you in <b>Cash received</b> — the app shows the change to give back.</li>'+
 '<li>Press the red <b>Charge</b> button.</li></ol>'+
 '<p>Stock goes down and drawer cash goes up by itself. You never type the total.</p>'+

 '<h3>Paying in other ways</h3>'+
 '<p>On the Checkout sheet, pick <b>Utang</b> to put it on a suki\'s account, or <b>E-wallet</b> if they paid by GCash or MariBank.</p>'+

 '<h3>If the camera will not open</h3>'+
 '<ul><li>Allow the camera the first time the phone asks.</li>'+
 '<li>Open Lucy Store from the home-screen icon, not from inside Messenger or Facebook — those mini-browsers block the camera.</li>'+
 '<li>Dark shop? Tap <b>Light</b> on the camera box.</li>'+
 '<li>Still nothing: type the numbers under the barcode into the box and continue. Scanning itself does not need internet.</li></ul>'+

 '<h3>A barcode it does not know</h3>'+
 '<p>The app asks whose item it is. Choose <b>Add as a new item</b> and fill in the price, or <b>Link to an item I already have</b>. It only asks once — after that the barcode rings itself up.</p>'+

 '<h3>Stock</h3>'+
 '<p><b>Restock</b> when new supplies arrive — enter how many you bought and what each one cost. <b>Adjust</b> for anything damaged, expired, given away or miscounted. <b>Edit</b> changes the name, price or barcode.</p>'+
 '<p>Red <b>Out of stock</b> and yellow <b>Low</b> tags tell you what to buy on your next trip; Home lists them under <b>Needs restocking</b>.</p>'+

 '<h3>Utang</h3>'+
 '<p>Add each suki once under <b>Utang → Add suki</b>. Tap their name to see the balance, <b>Collect payment</b> when they pay, or <b>Lend cash</b> if you handed them money. Anything owed for 14 days or more is flagged overdue.</p>'+

 '<h3>E-wallet</h3>'+
 '<p><b>Cash-in</b>: they give you cash, you send e-money. <b>Cash-out</b>: they send e-money, you give cash. <b>Load / bills</b>: you pay from your wallet, they pay you cash. <b>Move money</b>: shift money between the drawer and a wallet. The fee is suggested from the rate in Settings — change it any time.</p>'+

 '<h3>Two cash boxes</h3>'+
 '<p>The store and the billiard hall keep separate cash. Set what each one starts with in <b>Settings</b>. A sale pays into the box of whatever was sold, and a cart holding both a softdrink and a game splits between them by what each line cost.</p>'+
 '<p><b>Count cash</b> asks for both boxes — enter one and leave the other blank if you are only counting one. Restocking is paid by the business that owns the item, and <b>Owner in / out</b> asks which box you touched.</p>'+

 '<h3>Money</h3>'+
 '<p>Profit, cash in and cash out, and every entry recorded. <b>Count cash</b> at closing: count the real money, type it in, and the app records the difference so the drawer total stays honest. <b>Owner in / out</b> is for your own money going in or coming out — it does not count as profit.</p>'+

 '<h3>Made a mistake</h3>'+
 '<p>Find the entry in Money → Ledger or in the suki\'s history and press <b>Void</b>. Everything it touched — cash, stock, utang, wallet — is put back.</p>'+

 '<h3>Do not lose your records</h3>'+
 '<p>Everything lives on this one device — the phone and the laptop each keep their own books. <b>Settings → Back up data</b> saves a file; Home reminds you after two days without one. <b>Restore backup</b> brings it back on a new phone. Clearing browser data or deleting the app erases everything.</p>'+

 '<h3>The billiard hall</h3>'+
 '<p>Add the game like any item — <b>Stock → Add item</b>, name it <b>Billiard game</b>, put the price per game, set <b>Which business</b> to <b>Billiard hall</b>, and tick <b>This is a service</b>. Then every game is rung up on <b>Sell</b> exactly like a softdrink: tap it, Checkout, take the money. One tap per game, whoever is playing and however long they take.</p>'+

 '<p><b>Money → By business</b> then keeps the two apart: what the store earned, what the hall earned, each with its own sales, costs and expenses. When you record an expense, choose which business pays for it.</p>'+

 '<h3>How the business is doing</h3>'+
 '<p>The card at the top of Home reads the last 7 days against the 7 before and says it plainly — profit or loss, sales up or down, how much of every peso you keep, utang that has gone stale, shelves that have run empty. Green means fine, yellow means watch it, red means deal with it now.</p>'+

 '<h3>Sharing the records with the family</h3>'+
 '<p>Without syncing, each phone keeps its own separate books. To put everyone on the same records:</p>'+
 '<ol><li>On the first phone: <b>Settings → Turn on syncing</b>, make an account with an email and password, tap the link the email sends, then come back and sign in.</li>'+
 '<li>Press <b>Start a new shop</b>. It shows an 8-letter code.</li>'+
 '<li>On every other phone: sign in with the same account, type that code, press <b>Join</b>.</li></ol>'+
 '<p>After that every sale, every restock and every utang shows up on all of them within a minute. Keep selling with no signal — the entries wait on the phone and go up by themselves once you are back online.</p>'+
 '<p>Two people can ring up sales at the same time without clashing. If the same item is edited on two phones, the later edit wins.</p>'+
 '<p>The code is the key to your records. Share it with family only; anyone who has it sees everything. Settings shows it again whenever you need it.</p>'+

 '<h3>The calculator</h3>'+
 '<p>The round <b>=</b> button floats over every screen. Tap it to open the calculator, drag it anywhere that suits your counter, and drag the panel by its title bar. It stays where you leave it.</p>'+

 '<h3>PIN lock</h3>'+
 '<p><b>Settings → Set a PIN</b> (6 digits) scrambles the records on this device so only the PIN opens them. It re-locks by itself 5 minutes after you put the phone down. Once a PIN is set, <b>voiding a sale asks for it</b> — so nobody can quietly erase a sale and pocket the cash. <b>Nobody can recover a forgotten PIN</b>: a backup file is saved before the lock switches on, so keep it.</p>'+

 '<h3>Barcode scanner gun (laptop)</h3>'+
 '<p>Plug it in, open <b>Sell</b>, and scan — the item goes straight into the cart. It works on the Stock page too, where it opens Restock for that item.</p>'+
 '</div>'}

  if(scan.stream){scan.stream.getTracks().forEach(function(t){try{t.stop()}catch(e){}});scan.stream=null}

    var o=c.createOscillator(),g=c.createGain();o.frequency.value=920;o.connect(g);g.connect(c.destination);
    g.gain.setValueAtTime(.13,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);o.start();o.stop(c.currentTime+.18)}}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(35)}catch(e){}

  return window.BarcodeDetector.getSupportedFormats().then(function(sup){

  scan.timer=setInterval(function(){

function startScan(){
  var v=$('#scanvid');if(!v||!scan.mode)return;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){scanMsg('This browser will not open the camera here. Type the barcode below instead.','warn');return}
  if(window.isSecureContext===false){scanMsg('The camera only opens over https or from the installed app. Type the barcode below instead.','warn');return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30},focusMode:{ideal:'continuous'}},audio:false})
  .catch(function(){return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})})
  .then(function(st){
    if(!scan.mode){st.getTracks().forEach(function(t){t.stop()});return}
    scan.stream=st;scan.track=st.getVideoTracks()[0]||null;
    v.srcObject=st;var pr=v.play();if(pr&&pr.catch)pr.catch(function(){});
    setupTorch();

      if(!scan.mode)return;

/* ---------- PIN lock ----------
   The PIN derives an AES-GCM key with PBKDF2; the saved records are ciphertext, so a
   stolen phone gives up nothing without it. No PIN is stored anywhere — a wrong one
   simply fails to decrypt, and a forgotten one cannot be recovered by anybody.
   ponytail: 200k PBKDF2 rounds ~ 1s on an old phone. A 4-digit PIN is only strong
   enough to stop a person holding the phone; use 6+ digits if that matters. */
var TE=new TextEncoder(),TD=new TextDecoder();
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function unb64(str){var b=atob(str),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function hasCrypto(){return !!(window.crypto&&window.crypto.subtle&&window.isSecureContext!==false)}
function deriveKey(pin,salt){
  return crypto.subtle.importKey('raw',TE.encode(pin),'PBKDF2',false,['deriveKey']).then(function(base){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  });
}
var encBusy=false,encAgain=false;
function saveEnc(){
  if(encBusy){encAgain=true;return}
  encBusy=true;
  var json=JSON.stringify(S),iv=crypto.getRandomValues(new Uint8Array(12));
  crypto.subtle.encrypt({name:'AES-GCM',iv:iv},crypt.key,TE.encode(json)).then(function(ct){
    return writeStore(JSON.stringify({enc:1,salt:b64(crypt.salt),iv:b64(iv),ct:b64(ct)}));
  }).catch(function(){
    if(!memOnly){memOnly=true;toast('Could not save — back up now.')}
  }).then(function(){
    encBusy=false;if(encAgain){encAgain=false;saveEnc()}
  });
}

   Every item, suki, wallet, setting and ledger entry is one row keyed by kind+id, so the
   whole protocol is: push the rows whose contents changed, pull the rows the server has
   stamped since we last looked. The ledger is append-only and each entry already carries
   its own id, so two phones selling at once cannot collide. Items and suki are
   last-write-wins, decided by the server clock rather than any phone's.
   Talking to PostgREST and GoTrue over plain fetch keeps the offline bundle small —
   supabase-js would add 40 KB to do the same six requests.
   ponytail: a full hash of every doc each pass. At a sari-sari store's volume that is
   microseconds; if the ledger ever reaches six figures, keep a dirty set instead. */

/* One pointer-drag helper for both the bubble and the panel. */
function drag(el,handle,done,tap){

    if(e.target.closest('button[data-k]')&&handle!==el)return;

  var keep=S,out=[],fails=0;
  function ok(name,got,want){
    var pass=JSON.stringify(got)===JSON.stringify(want);
    if(!pass)fails++;
    out.push((pass?'PASS  ':'FAIL  ')+name+(pass?'':'\n        got  '+JSON.stringify(got)+'\n        want '+JSON.stringify(want)));
  }
  S=fresh();
  S.store.opening={store:100,billiard:50};
  S.items=[{id:'i1',name:'Soft drink',price:20,cost:15,biz:'store',start:10},
           {id:'i2',name:'Game',price:30,cost:0,biz:'billiard',svc:true}];

  var c=calcRaw();
  ok('opening cash splits per drawer',[c.drawer.store,c.drawer.billiard,c.cash],[100,50,150]);

  /* a pure billiard sale must not touch the store drawer */
  S.tx.push({id:'t1',ts:1,type:'sale',cash:60,biz:'billiard',rev:60,cogs:0,
             lines:[{iid:'i2',name:'Game',qty:2,price:30,cost:0,biz:'billiard'}]});
  c=calcRaw();
  ok('billiard sale pays the billiard drawer',[c.drawer.store,c.drawer.billiard],[100,110]);

  /* a mixed cart splits by what each line sold for */
  S.tx.push({id:'t2',ts:2,type:'sale',cash:50,cb:{store:20,billiard:30},rev:50,cogs:15,
             lines:[{iid:'i1',name:'Soft drink',qty:1,price:20,cost:15,biz:'store'},
                    {iid:'i2',name:'Game',qty:1,price:30,cost:0,biz:'billiard'}]});
  c=calcRaw();
  ok('mixed sale splits between both drawers',[c.drawer.store,c.drawer.billiard],[120,140]);
  ok('total still equals the two drawers',c.cash,r2(c.drawer.store+c.drawer.billiard));

  /* an entry from before there were two drawers belongs to the store */
  S.tx.push({id:'t3',ts:3,type:'expense',cash:-10,exp:10});
  c=calcRaw();
  ok('an entry with no business is the store\'s',[c.drawer.store,c.drawer.billiard],[110,140]);

  /* profit stays split too, and the halves add up to the whole */
  var r=summ(0,9);
  ok('profit per business',[r.biz.store.rev,r.biz.billiard.rev],[20,90]);
  ok('the two nets add up to the total net',r2(r.biz.store.net+r.biz.billiard.net),r.net);

  /* voiding must reverse the right drawer */
  S.tx[0].void=1;
  c=calcRaw();
  ok('voiding a billiard sale only moves that drawer',[c.drawer.store,c.drawer.billiard],[110,80]);

  S=keep;calcCache=null;stamp++;
  var head=fails?fails+' FAILED':'all '+out.length+' checks passed';
  document.body.innerHTML='<pre style="padding:1rem;font:13px ui-monospace,Consolas,monospace;white-space:pre-wrap">'+
    esc(head+'\n\n'+out.join('\n'))+'</pre>';
  return fails===0;
}

function boot(){
  return readStore().then(function(raw){
    store.raw=raw;
    if(!raw)return;
    if(raw.indexOf('"enc"')>=0){try{if(JSON.parse(raw).enc){locked=true;return}}catch(e){}}
    try{var st=parseState(raw);if(st){S=st;stamp++;return}}catch(e){}
    try{localStorage.setItem(KEY+'.broken',raw)}catch(e){}   /* keep the unreadable copy instead of erasing it */
  }).catch(function(){}).then(function(){
    window.lucyStoreSelftest=selftest;          /* also runnable from the console */
    if(location.hash==='#selftest'){selftest();return}
    if(locked)lockScreen();else{render();syncNow(true)}
  });
}
boot();

if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
})();
</script>
